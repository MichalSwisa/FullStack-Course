
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Callback Hell</title>
</head>
<body>

  <div id="box">Hello World</div>

  <script>
    const box = document.getElementById("box");

    setTimeout(() => {
      box.style.backgroundColor = "red";

      setTimeout(() => {
        box.style.fontSize = "50px";

        setTimeout(() => {
          box.style.backgroundColor = "purple";

          setTimeout(() => {
            box.innerText += " callback hell";
          }, 5000);

        }, 5000);

      }, 5000);

    }, 5000);
  </script>

</body>
</html>
